name: Daily News Aggregation

on:
  schedule:
    # Run every day at 6:00 AM CET (5:00 AM UTC in winter, 4:00 AM UTC in summer)
    - cron: '0 4 * * *'  # 4 AM UTC = 6 AM CEST (summer)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Allow pushing commits

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Use 3.11 for better compatibility

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Run aggregation
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python -m backend.aggregator

    - name: Check generated data
      run: |
        echo "Generated files:"
        ls -lh data/*.json || echo "No JSON files generated"
        if [ -f "data/$(date +'%Y-%m-%d').json" ]; then
          echo "Today's file content preview:"
          head -50 "data/$(date +'%Y-%m-%d').json"
        fi

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/*.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update news for $(date +'%Y-%m-%d')" && git push)
