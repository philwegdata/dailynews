name: Daily News Aggregation

on:
  schedule:
    # Run every day at 6:00 AM CET (5:00 AM UTC in winter, 4:00 AM UTC in summer)
    - cron: '0 4 * * *'  # 4 AM UTC = 6 AM CEST (summer)
  workflow_dispatch:  # Allow manual trigger

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'  # Use 3.11 for better compatibility

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run aggregation
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python -m backend.aggregator

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/*.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update news for $(date +'%Y-%m-%d')" && git push)
