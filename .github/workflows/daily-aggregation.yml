name: Daily News Aggregation

on:
  schedule:
    # Run at 5 AM UTC = 6 AM CET (winter) / 7 AM CEST (summer)
    # GitHub Actions doesn't support DST-aware scheduling, so we optimize for CET
    - cron: '0 5 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Allow pushing commits

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Use 3.11 for better compatibility

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Run aggregation
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python -m backend.aggregator

    - name: Check generated data
      run: |
        echo "Generated files:"
        ls -lh data/*.json || echo "No JSON files generated"
        if [ -f "data/$(date +'%Y-%m-%d').json" ]; then
          echo "Today's file content preview:"
          head -50 "data/$(date +'%Y-%m-%d').json"
        fi

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/*.json

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Update news for $(date +'%Y-%m-%d')"

        # Push with retry logic for network resilience
        for i in 1 2 3 4; do
          if git push; then
            echo "Push successful"
            exit 0
          fi
          echo "Push attempt $i failed, retrying in $((2**i)) seconds..."
          sleep $((2**i))
        done

        echo "All push attempts failed"
        exit 1
